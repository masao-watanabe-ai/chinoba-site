<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Intelligence Field</title>
<desc id="d">People, AI systems, organizations and institutions, data and knowledge, and environment and community are connected by relationships such as delegation, authority, provenance, context and norms. Intelligence emerges in the relationships between them rather than inside any one node.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.18"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="780" fill="#0b0b0b"/>
<text x="48" y="58" fill="#6a6a6a" font-size="15" letter-spacing="3">THE INTELLIGENCE FIELD</text>
<circle cx="600" cy="385" r="250" fill="url(#glow)"/>
<!-- ring edges -->
<g stroke="#3b4252" stroke-width="2" fill="none" stroke-dasharray="6 6">
<path d="M690 126 L930 250"/>
<path d="M1030 340 L960 540"/>
<path d="M740 650 L460 650"/>
<path d="M250 540 L180 340"/>
<path d="M270 250 L510 126"/>
</g>
<!-- spokes -->
<g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ar)" marker-start="url(#ar)">
<path d="M600 215 L600 175"/>
<path d="M705 330 L840 285"/>
<path d="M680 460 L760 560"/>
<path d="M520 460 L440 560"/>
<path d="M497 330 L392 296"/>
</g>
<!-- ring labels -->
<g font-size="16" fill="#9ca3af" text-anchor="middle">
<text x="838" y="168">delegation · oversight</text>
<text x="1102" y="452">authority · policy</text>
<text x="600" y="688">records · provenance</text>
<text x="98" y="452">context · consent</text>
<text x="362" y="168">norms · reputation</text>
</g>
<!-- center -->
<circle cx="600" cy="385" r="118" fill="#0f172a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="600" y="368" text-anchor="middle" fill="#f5f5f5" font-size="26" font-weight="700">Intelligence</text>
<text x="600" y="400" text-anchor="middle" fill="#f5f5f5" font-size="26" font-weight="700">Field</text>
<text x="600" y="432" text-anchor="middle" fill="#93c5fd" font-size="15">emerges between nodes</text>
<!-- nodes -->
<g>
<rect x="470" y="82" width="260" height="92" rx="10" fill="#111" stroke="#60a5fa" stroke-width="2"/>
<text x="600" y="120" text-anchor="middle" fill="#f5f5f5" font-size="22" font-weight="700">People</text>
<text x="600" y="150" text-anchor="middle" fill="#b0b0b0" font-size="16">judgment · purpose · accountability</text>

<rect x="850" y="236" width="270" height="104" rx="10" fill="#111" stroke="#a78bfa" stroke-width="2"/>
<text x="985" y="274" text-anchor="middle" fill="#f5f5f5" font-size="22" font-weight="700">AI Systems</text>
<text x="985" y="302" text-anchor="middle" fill="#b0b0b0" font-size="16">models · agents · tools</text>
<text x="985" y="324" text-anchor="middle" fill="#b0b0b0" font-size="16">capability within a granted role</text>

<rect x="705" y="560" width="340" height="104" rx="10" fill="#111" stroke="#fb923c" stroke-width="2"/>
<text x="875" y="598" text-anchor="middle" fill="#f5f5f5" font-size="21" font-weight="700">Organizations &amp; Institutions</text>
<text x="875" y="626" text-anchor="middle" fill="#b0b0b0" font-size="16">roles · rules · memory</text>
<text x="875" y="648" text-anchor="middle" fill="#b0b0b0" font-size="16">the authority that makes acts count</text>

<rect x="180" y="560" width="290" height="104" rx="10" fill="#111" stroke="#4ade80" stroke-width="2"/>
<text x="325" y="598" text-anchor="middle" fill="#f5f5f5" font-size="22" font-weight="700">Data &amp; Knowledge</text>
<text x="325" y="626" text-anchor="middle" fill="#b0b0b0" font-size="16">sources · decisions · evidence</text>
<text x="325" y="648" text-anchor="middle" fill="#b0b0b0" font-size="16">useful only with provenance</text>

<rect x="50" y="236" width="330" height="104" rx="10" fill="#111" stroke="#2dd4bf" stroke-width="2"/>
<text x="215" y="274" text-anchor="middle" fill="#f5f5f5" font-size="21" font-weight="700">Environment &amp; Community</text>
<text x="215" y="302" text-anchor="middle" fill="#b0b0b0" font-size="16">local context · norms</text>
<text x="215" y="324" text-anchor="middle" fill="#b0b0b0" font-size="16">the conditions of the work</text>
</g>
<text x="600" y="742" text-anchor="middle" fill="#9ca3af" font-size="17">Intelligence is not located in any one node. It emerges in the quality of the relationships between them.</text>
</svg>
