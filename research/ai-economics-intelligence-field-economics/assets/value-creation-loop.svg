<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Value Creation Loop of an Intelligence Field</title>
<desc id="d">Knowledge, evidence, trust, incentives, governance and learning form a loop. Knowledge gains evidence, evidence supports calibrated trust, trust enables incentives and value exchange, governance bounds the exchange, and learning returns outcomes to knowledge.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
</defs>
<rect width="1200" height="820" fill="#0b0b0b"/>
<text x="48" y="58" fill="#6a6a6a" font-size="15" letter-spacing="3">THE VALUE CREATION LOOP</text>
<g fill="none" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#ab)">
<path d="M750 140 Q 880 150 900 220"/>
<path d="M933 316 L933 500"/>
<path d="M900 596 Q 880 690 752 700"/>
<path d="M448 700 Q 320 690 300 598"/>
<path d="M267 504 L267 316"/>
<path d="M300 222 Q 320 150 448 140"/>
</g>
<g>
<rect x="450" y="84" width="300" height="92" rx="10" fill="#111" stroke="#4ade80" stroke-width="2"/>
<text x="600" y="123" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">1 · Knowledge</text>
<text x="600" y="153" text-anchor="middle" fill="#b0b0b0" font-size="17">shared, current, in context</text>

<rect x="788" y="224" width="290" height="92" rx="10" fill="#111" stroke="#60a5fa" stroke-width="2"/>
<text x="933" y="263" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">2 · Evidence</text>
<text x="933" y="293" text-anchor="middle" fill="#b0b0b0" font-size="17">claims carry their basis</text>

<rect x="788" y="504" width="290" height="92" rx="10" fill="#111" stroke="#a78bfa" stroke-width="2"/>
<text x="933" y="543" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">3 · Trust</text>
<text x="933" y="573" text-anchor="middle" fill="#b0b0b0" font-size="17">expectation, calibrated by outcome</text>

<rect x="450" y="644" width="300" height="92" rx="10" fill="#111" stroke="#fb923c" stroke-width="2"/>
<text x="600" y="683" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">4 · Incentives</text>
<text x="600" y="713" text-anchor="middle" fill="#b0b0b0" font-size="17">reward lasting contribution</text>

<rect x="122" y="504" width="290" height="92" rx="10" fill="#111" stroke="#f87171" stroke-width="2"/>
<text x="267" y="543" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">5 · Governance</text>
<text x="267" y="573" text-anchor="middle" fill="#b0b0b0" font-size="17">consent, authority, exit, appeal</text>

<rect x="122" y="224" width="290" height="92" rx="10" fill="#111" stroke="#2dd4bf" stroke-width="2"/>
<text x="267" y="263" text-anchor="middle" fill="#f5f5f5" font-size="24" font-weight="700">6 · Learning</text>
<text x="267" y="293" text-anchor="middle" fill="#b0b0b0" font-size="17">outcomes return to the field</text>
</g>
<circle cx="600" cy="410" r="130" fill="#0f172a" stroke="#334155" stroke-width="2"/>
<text x="600" y="396" text-anchor="middle" fill="#f5f5f5" font-size="26" font-weight="700">Collective value</text>
<text x="600" y="428" text-anchor="middle" fill="#93c5fd" font-size="16">decisions that improve,</text>
<text x="600" y="450" text-anchor="middle" fill="#93c5fd" font-size="16">verifiably, over time</text>
<text x="600" y="790" text-anchor="middle" fill="#9ca3af" font-size="17">A loop that skips governance or learning still moves, but it extracts value instead of compounding it.</text>
</svg>
