<path d="M534,215 L586,215" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<path d="M214,325 L266,325" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<path d="M534,325 L586,325" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<rect x="30" y="440" width="740" height="56" rx="4" fill="#111111" stroke="#2a2a2a"/>
<text x="400" y="464" text-anchor="middle" fill="#f5f5f5" font-size="14" font-weight="600" letter-spacing="0">Policy is decided by the organization: owners, risk, and data classes.</text>
<text x="400" y="484" text-anchor="middle" fill="#b0b0b0" font-size="13" font-weight="400" letter-spacing="0">The Gateway does not invent policy; it enforces it and records what happened.</text>
