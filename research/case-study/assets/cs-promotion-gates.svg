<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Gates between prototype and production</title><desc id="d">A prototype passes an evidence gate, an approval gate and a reversibility gate before limited production; failures return to revision or stop.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7db7ff"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs>
<rect width="800" height="480" fill="#0b0b0b"/>
<text x="400" y="34" text-anchor="middle" fill="#8a8a8a" font-size="12" font-weight="600" letter-spacing="3">BEFORE ANYTHING IS PROMOTED</text>
<rect x="20" y="130" width="130" height="100" rx="4" fill="#111111" stroke="#2a2a2a" stroke-width="1"/><text x="85.0" y="176.0" text-anchor="middle" fill="#f5f5f5" font-size="16" font-weight="600">Prototype</text><text x="85.0" y="197.0" text-anchor="middle" fill="#b0b0b0" font-size="13">Learns</text>
<rect x="200" y="105" width="140" height="150" rx="4" fill="#0f1620" stroke="#7db7ff" stroke-width="1.3"/>
<text x="270" y="140" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="600" letter-spacing="0">Evidence gate</text>
<text x="270" y="185" text-anchor="middle" fill="#b0b0b0" font-size="12.5" font-weight="400" letter-spacing="0">Grounded answers,</text>
<text x="270" y="204" text-anchor="middle" fill="#b0b0b0" font-size="12.5" font-weight="400" letter-spacing="0">tested on real cases</text>
<rect x="370" y="105" width="140" height="150" rx="4" fill="#0f1620" stroke="#7db7ff" stroke-width="1.3"/>
<text x="440" y="140" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="600" letter-spacing="0">Approval gate</text>
<text x="440" y="185" text-anchor="middle" fill="#b0b0b0" font-size="12.5" font-weight="400" letter-spacing="0">Named owner accepts</text>
<text x="440" y="204" text-anchor="middle" fill="#b0b0b0" font-size="12.5" font-weight="400" letter-spacing="0">scope and residual risk</text>
<rect x="540" y="105" width="140" height="150" rx="4" fill="#0f1620" stroke="#7db7ff" stroke-width="1.3"/>
<text x="610" y="140" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="600" letter-spacing="0">Reversibility gate</text>
<text x="610" y="185" text-anchor="middle" fill="#b0b0b0" font-size="12.5" font-weight="400" letter-spacing="0">Shadow mode, rollback,</text>
<text x="610" y="204" text-anchor="middle" fill="#b0b0b0" font-size="12.5" font-weight="400" letter-spacing="0">manual fallback</text>
<rect x="710" y="130" width="80" height="100" rx="4" fill="#111111" stroke="#2a2a2a" stroke-width="1"/><text x="750.0" y="176.0" text-anchor="middle" fill="#f5f5f5" font-size="15" font-weight="600">Limited</text><text x="750.0" y="197.0" text-anchor="middle" fill="#b0b0b0" font-size="13">ops</text>
<path d="M153,180 L197,180" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<path d="M343,180 L367,180" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<path d="M513,180 L537,180" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<path d="M683,180 L707,180" stroke="#7db7ff" stroke-width="1.5" fill="none"  marker-end="url(#ar)"/>
<path d="M280,259 L280,320 L85,320 L85,234" stroke="#8a8a8a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ag)"/>
<text x="182" y="340" text-anchor="middle" fill="#8a8a8a" font-size="12.5" font-weight="400" letter-spacing="0">revise: fix the gap, re-test</text>
<rect x="20" y="370" width="770" height="84" rx="4" fill="#111111" stroke="#2a2a2a"/>
<text x="405" y="398" text-anchor="middle" fill="#f5f5f5" font-size="13" font-weight="600" letter-spacing="0">Rollout order after the gates</text>
<text x="405" y="424" text-anchor="middle" fill="#b0b0b0" font-size="14" font-weight="400" letter-spacing="0">Shadow mode  →  limited release  →  low-risk support  →  wider scope</text>
<text x="405" y="444" text-anchor="middle" fill="#8a8a8a" font-size="12.5" font-weight="400" letter-spacing="0">Expansion is judged on evidence and boundaries, not on usage numbers.</text>
</svg>
