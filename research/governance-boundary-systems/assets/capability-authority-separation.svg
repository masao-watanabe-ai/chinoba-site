<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Capability Is Not Authority</title><desc id="d">One AI agent may be technically able to change code, deploy, connect externally, export data and take financial or operational actions. Each is a separate authority with its own runtime gate and its own grantor.</desc>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="860" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle">Capability Is Not Authority</text>
<text x="600" y="78" font-size="17" fill="#94a3b8" text-anchor="middle">The same agent, five separate permissions — each gated and granted on its own</text>
<rect x="40" y="130" width="230" height="660" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="155.0" y="178" font-size="22" fill="#60a5fa" font-weight="bold" text-anchor="middle">AI agent</text>
<text x="155.0" y="208" font-size="17" fill="#cbd5e1" text-anchor="middle"></text>
<text x="155.0" y="233" font-size="17" fill="#cbd5e1" text-anchor="middle">Capable of:</text>
<text x="155.0" y="258" font-size="17" fill="#cbd5e1" text-anchor="middle"></text>
<text x="155.0" y="283" font-size="17" fill="#cbd5e1" text-anchor="middle">propose a change</text>
<text x="155.0" y="308" font-size="17" fill="#cbd5e1" text-anchor="middle">write code</text>
<text x="155.0" y="333" font-size="17" fill="#cbd5e1" text-anchor="middle">call APIs</text>
<text x="155.0" y="358" font-size="17" fill="#cbd5e1" text-anchor="middle">query data</text>
<text x="155.0" y="383" font-size="17" fill="#cbd5e1" text-anchor="middle">send messages</text>
<text x="155.0" y="408" font-size="17" fill="#cbd5e1" text-anchor="middle"></text>
<text x="155.0" y="433" font-size="17" fill="#cbd5e1" text-anchor="middle">Capability is</text>
<text x="155.0" y="458" font-size="17" fill="#cbd5e1" text-anchor="middle">a technical fact.</text>
<text x="155.0" y="483" font-size="17" fill="#cbd5e1" text-anchor="middle">It grants no</text>
<text x="155.0" y="508" font-size="17" fill="#cbd5e1" text-anchor="middle">authority.</text>
<text x="405" y="128" font-size="15" fill="#94a3b8" font-weight="bold" text-anchor="middle">RUNTIME GATE</text>
<text x="895" y="128" font-size="15" fill="#94a3b8" font-weight="bold" text-anchor="middle">AUTHORITY GRANTED BY</text>
<line x1="272" y1="200" x2="300" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="300" y="150" width="210" height="100" rx="12" fill="#10281d" stroke="#4ade80" stroke-width="2"/>
<text x="405" y="206" font-size="19" fill="#4ade80" font-weight="bold" text-anchor="middle">Code change</text>
<rect x="530" y="150" width="330" height="100" rx="12" fill="#10281d" stroke="#4ade80" stroke-width="2"/>
<text x="695" y="194" font-size="17" fill="#cbd5e1" text-anchor="middle">Scoped write to one branch;</text>
<text x="695" y="218" font-size="17" fill="#cbd5e1" text-anchor="middle">tests and checks must pass</text>
<line x1="862" y1="200" x2="890" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="890" y="150" width="270" height="100" rx="12" fill="#1a2233" stroke="#94a3b8" stroke-width="2"/>
<text x="1025" y="194" font-size="17" fill="#cbd5e1" text-anchor="middle">Independent review; author</text>
<text x="1025" y="218" font-size="17" fill="#cbd5e1" text-anchor="middle">is not the approver</text>
<line x1="272" y1="328" x2="300" y2="328" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="300" y="278" width="210" height="100" rx="12" fill="#2d1d10" stroke="#fb923c" stroke-width="2"/>
<text x="405" y="334" font-size="19" fill="#fb923c" font-weight="bold" text-anchor="middle">Deploy</text>
<rect x="530" y="278" width="330" height="100" rx="12" fill="#2d1d10" stroke="#fb923c" stroke-width="2"/>
<text x="695" y="322" font-size="17" fill="#cbd5e1" text-anchor="middle">Separate deploy role; change</text>
<text x="695" y="346" font-size="17" fill="#cbd5e1" text-anchor="middle">window; rollback ready</text>
<line x1="862" y1="328" x2="890" y2="328" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="890" y="278" width="270" height="100" rx="12" fill="#1a2233" stroke="#94a3b8" stroke-width="2"/>
<text x="1025" y="334" font-size="17" fill="#cbd5e1" text-anchor="middle">Human release approver</text>
<line x1="272" y1="456" x2="300" y2="456" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="300" y="406" width="210" height="100" rx="12" fill="#2d1517" stroke="#f87171" stroke-width="2"/>
<text x="405" y="462" font-size="19" fill="#f87171" font-weight="bold" text-anchor="middle">External connection</text>
<rect x="530" y="406" width="330" height="100" rx="12" fill="#2d1517" stroke="#f87171" stroke-width="2"/>
<text x="695" y="450" font-size="17" fill="#cbd5e1" text-anchor="middle">Egress only to registered,</text>
<text x="695" y="474" font-size="17" fill="#cbd5e1" text-anchor="middle">allow-listed endpoints</text>
<line x1="862" y1="456" x2="890" y2="456" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="890" y="406" width="270" height="100" rx="12" fill="#1a2233" stroke="#94a3b8" stroke-width="2"/>
<text x="1025" y="450" font-size="17" fill="#cbd5e1" text-anchor="middle">Security owner approves</text>
<text x="1025" y="474" font-size="17" fill="#cbd5e1" text-anchor="middle">each new destination</text>
<line x1="272" y1="584" x2="300" y2="584" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="300" y="534" width="210" height="100" rx="12" fill="#1e1838" stroke="#a78bfa" stroke-width="2"/>
<text x="405" y="590" font-size="19" fill="#a78bfa" font-weight="bold" text-anchor="middle">Data export</text>
<rect x="530" y="534" width="330" height="100" rx="12" fill="#1e1838" stroke="#a78bfa" stroke-width="2"/>
<text x="695" y="578" font-size="17" fill="#cbd5e1" text-anchor="middle">Classification and purpose</text>
<text x="695" y="602" font-size="17" fill="#cbd5e1" text-anchor="middle">check; minimum disclosure</text>
<line x1="862" y1="584" x2="890" y2="584" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="890" y="534" width="270" height="100" rx="12" fill="#1a2233" stroke="#94a3b8" stroke-width="2"/>
<text x="1025" y="578" font-size="17" fill="#cbd5e1" text-anchor="middle">Data owner for sensitive</text>
<text x="1025" y="602" font-size="17" fill="#cbd5e1" text-anchor="middle">or regulated data</text>
<line x1="272" y1="712" x2="300" y2="712" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="300" y="662" width="210" height="100" rx="12" fill="#2d1d10" stroke="#fb923c" stroke-width="2"/>
<text x="405" y="706" font-size="19" fill="#fb923c" font-weight="bold" text-anchor="middle">Financial /</text>
<text x="405" y="732" font-size="19" fill="#fb923c" font-weight="bold" text-anchor="middle">operational</text>
<rect x="530" y="662" width="330" height="100" rx="12" fill="#2d1d10" stroke="#fb923c" stroke-width="2"/>
<text x="695" y="694" font-size="17" fill="#cbd5e1" text-anchor="middle">Amount, impact, and</text>
<text x="695" y="718" font-size="17" fill="#cbd5e1" text-anchor="middle">reversibility limits per</text>
<text x="695" y="742" font-size="17" fill="#cbd5e1" text-anchor="middle">action</text>
<line x1="862" y1="712" x2="890" y2="712" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#agray)"/>
<rect x="890" y="662" width="270" height="100" rx="12" fill="#1a2233" stroke="#94a3b8" stroke-width="2"/>
<text x="1025" y="706" font-size="17" fill="#cbd5e1" text-anchor="middle">Accountable manager above</text>
<text x="1025" y="730" font-size="17" fill="#cbd5e1" text-anchor="middle">the limit</text>
<text x="695" y="810" font-size="17" fill="#60a5fa" font-weight="bold" text-anchor="middle">A permission granted for one row never carries over to another.</text>
</svg>
