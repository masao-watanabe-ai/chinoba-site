<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Governance Boundary Map</title><desc id="d">Seven boundaries — Data and Knowledge, Identity and Authority, Decision, Tool and Execution, External Connection, Time and Freshness, and Organizational Responsibility — are evaluated together at runtime. Each can allow, escalate, or stop an AI action.</desc>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="860" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle">The Governance Boundary Map</text>
<text x="600" y="78" font-size="17" fill="#94a3b8" text-anchor="middle">Seven questions asked of every consequential AI action, at the moment it is attempted</text>
<rect x="60" y="120" width="260" height="240" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="190.0" y="164" font-size="19" fill="#60a5fa" font-weight="bold" text-anchor="middle">1  Data / Knowledge</text>
<text x="190" y="210" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">What may it know?</text>
<text x="190" y="250" font-size="16" fill="#cbd5e1" text-anchor="middle">Which sources, at what</text>
<text x="190" y="276" font-size="16" fill="#cbd5e1" text-anchor="middle">classification, for what purpose</text>
<text x="190" y="325" font-size="15" fill="#60a5fa" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="333" y="120" width="260" height="240" rx="12" fill="#1e1838" stroke="#a78bfa" stroke-width="2"/>
<text x="463.0" y="164" font-size="19" fill="#a78bfa" font-weight="bold" text-anchor="middle">2  Identity / Authority</text>
<text x="463" y="210" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">Who is acting, for whom?</text>
<text x="463" y="250" font-size="16" fill="#cbd5e1" text-anchor="middle">Whose authority, delegated</text>
<text x="463" y="276" font-size="16" fill="#cbd5e1" text-anchor="middle">how far, for how long</text>
<text x="463" y="325" font-size="15" fill="#a78bfa" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="606" y="120" width="260" height="240" rx="12" fill="#10281d" stroke="#4ade80" stroke-width="2"/>
<text x="736.0" y="164" font-size="19" fill="#4ade80" font-weight="bold" text-anchor="middle">3  Decision</text>
<text x="736" y="210" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">What may it conclude?</text>
<text x="736" y="250" font-size="16" fill="#cbd5e1" text-anchor="middle">Recommend, decide, or</text>
<text x="736" y="276" font-size="16" fill="#cbd5e1" text-anchor="middle">only draft for a human</text>
<text x="736" y="325" font-size="15" fill="#4ade80" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="880" y="120" width="260" height="240" rx="12" fill="#2d1d10" stroke="#fb923c" stroke-width="2"/>
<text x="1010.0" y="164" font-size="19" fill="#fb923c" font-weight="bold" text-anchor="middle">4  Tool / Execution</text>
<text x="1010" y="210" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">What may it actually do?</text>
<text x="1010" y="250" font-size="16" fill="#cbd5e1" text-anchor="middle">Which tools, with which</text>
<text x="1010" y="276" font-size="16" fill="#cbd5e1" text-anchor="middle">arguments, on which targets</text>
<text x="1010" y="325" font-size="15" fill="#fb923c" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="60" y="400" width="260" height="240" rx="12" fill="#2d1517" stroke="#f87171" stroke-width="2"/>
<text x="190.0" y="444" font-size="19" fill="#f87171" font-weight="bold" text-anchor="middle">5  External Connection</text>
<text x="190" y="490" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">Where may it connect?</text>
<text x="190" y="530" font-size="16" fill="#cbd5e1" text-anchor="middle">Which destinations, which</text>
<text x="190" y="556" font-size="16" fill="#cbd5e1" text-anchor="middle">payloads, which credentials</text>
<text x="190" y="605" font-size="15" fill="#f87171" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="333" y="400" width="260" height="240" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="463.0" y="444" font-size="19" fill="#60a5fa" font-weight="bold" text-anchor="middle">6  Time / Freshness</text>
<text x="463" y="490" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">Is it still valid?</text>
<text x="463" y="530" font-size="16" fill="#cbd5e1" text-anchor="middle">Effective dates, expiry,</text>
<text x="463" y="556" font-size="16" fill="#cbd5e1" text-anchor="middle">revocation, approval lifetime</text>
<text x="463" y="605" font-size="15" fill="#60a5fa" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="606" y="400" width="260" height="240" rx="12" fill="#1e1838" stroke="#a78bfa" stroke-width="2"/>
<text x="736.0" y="444" font-size="19" fill="#a78bfa" font-weight="bold" text-anchor="middle">7  Org. / Responsibility</text>
<text x="736" y="490" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="middle">Who owns the outcome?</text>
<text x="736" y="530" font-size="16" fill="#cbd5e1" text-anchor="middle">Named owner, approver,</text>
<text x="736" y="556" font-size="16" fill="#cbd5e1" text-anchor="middle">and escalation path</text>
<text x="736" y="605" font-size="15" fill="#a78bfa" font-weight="bold" text-anchor="middle">allow · escalate · stop</text>
<rect x="880" y="400" width="260" height="240" rx="12" fill="#1a2233" stroke="#94a3b8" stroke-width="2"/>
<text x="1010.0" y="444" font-size="19" fill="#94a3b8" font-weight="bold" text-anchor="middle">Every boundary</text>
<text x="1010.0" y="471" font-size="17" fill="#cbd5e1" text-anchor="middle"></text>
<text x="1010.0" y="496" font-size="17" fill="#cbd5e1" text-anchor="middle">can end in one of</text>
<text x="1010.0" y="521" font-size="17" fill="#cbd5e1" text-anchor="middle">three outcomes:</text>
<text x="1010.0" y="546" font-size="17" fill="#cbd5e1" text-anchor="middle"></text>
<text x="1010.0" y="571" font-size="17" fill="#cbd5e1" text-anchor="middle">Allow with Evidence</text>
<text x="1010.0" y="596" font-size="17" fill="#cbd5e1" text-anchor="middle">Escalate to a human</text>
<text x="1010.0" y="621" font-size="17" fill="#cbd5e1" text-anchor="middle">Stop and record</text>
<rect x="60" y="690" width="1080" height="120" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="600.0" y="730" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">Evaluated together, at runtime, for each request</text>
<text x="600.0" y="759" font-size="17" fill="#cbd5e1" text-anchor="middle">Allowed on one boundary does not mean allowed on the others. Authority without fresh knowledge,</text>
<text x="600.0" y="784" font-size="17" fill="#cbd5e1" text-anchor="middle">or a valid tool without an approved destination, is still an Escalate or a Stop.</text>
</svg>
