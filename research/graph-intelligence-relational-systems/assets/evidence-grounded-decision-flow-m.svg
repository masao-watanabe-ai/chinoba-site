<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" width="720" height="1180" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="t">Evidence-grounded decision flow</title>
