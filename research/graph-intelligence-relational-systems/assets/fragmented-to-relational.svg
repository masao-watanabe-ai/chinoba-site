<text x="900" y="386" font-size="24" fill="#e8efff" font-weight="700" text-anchor="middle" letter-spacing="0">Graph</text>
<rect x="640" y="110" width="520" height="500" rx="24" fill="none" fill-opacity="1" stroke="#223566" stroke-width="2" stroke-dasharray="8 10"/>
<text x="600" y="648" font-size="24" fill="#9fb0d4" font-weight="400" text-anchor="middle" letter-spacing="0">Same information. What changes is whether relations, evidence and time are kept.</text>
