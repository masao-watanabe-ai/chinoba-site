<text x="1085" y="432" font-size="26" fill="#c9d6f2" font-weight="400" text-anchor="middle" letter-spacing="0">Equipment</text>
<circle cx="790" cy="520" r="34" fill="#0b1736" stroke="#22d3ee" stroke-width="3"/>
<text x="790" y="582" font-size="26" fill="#c9d6f2" font-weight="400" text-anchor="middle" letter-spacing="0">Rules</text>
<circle cx="1010" cy="520" r="34" fill="#0b1736" stroke="#a78bfa" stroke-width="3"/>
<text x="1010" y="582" font-size="26" fill="#c9d6f2" font-weight="400" text-anchor="middle" letter-spacing="0">Decisions</text>
<circle cx="900" cy="360" r="64" fill="#12306b" stroke="#22d3ee" stroke-width="4"/>
