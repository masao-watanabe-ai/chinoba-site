<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" width="720" height="980" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="t">Graph Intelligence maturity roadmap</title>
<desc id="d">Four levels: Connected Retrieval, Evidence-Grounded Answers, Decision Support, Governed Agent Coordination. Governance requirements rise at each level.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1f"/><stop offset="1" stop-color="#0e1c42"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7db7ff"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
</defs>
<rect width="720" height="980" fill="url(#bg)"/>
<rect x="110" y="30" width="580" height="175" rx="18" fill="#0f1f4a" fill-opacity="1" stroke="#3b82f6" stroke-width="3"/>
<rect x="110" y="30" width="580" height="8" rx="4" fill="#3b82f6"/>
<text x="134" y="80" font-size="34" fill="#3b82f6" font-weight="700" text-anchor="start" letter-spacing="0">L1</text>
<text x="204" y="80" font-size="28" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Connected Retrieval</text>
<text x="134" y="180" font-size="24" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">entities · links</text>
<rect x="140" y="235" width="550" height="175" rx="18" fill="#0f1f4a" fill-opacity="1" stroke="#38bdf8" stroke-width="3"/>
<rect x="140" y="235" width="550" height="8" rx="4" fill="#38bdf8"/>
<text x="164" y="285" font-size="34" fill="#38bdf8" font-weight="700" text-anchor="start" letter-spacing="0">L2</text>
<text x="234" y="285" font-size="28" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Evidence-Grounded Answers</text>
<text x="164" y="385" font-size="24" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">citations · receipts</text>
<rect x="170" y="440" width="520" height="175" rx="18" fill="#0f1f4a" fill-opacity="1" stroke="#22d3ee" stroke-width="3"/>
<rect x="170" y="440" width="520" height="8" rx="4" fill="#22d3ee"/>
<text x="194" y="490" font-size="34" fill="#22d3ee" font-weight="700" text-anchor="start" letter-spacing="0">L3</text>
<text x="264" y="490" font-size="28" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Decision Support</text>
<text x="194" y="590" font-size="24" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">options · human review</text>
<rect x="200" y="645" width="490" height="175" rx="18" fill="#0f1f4a" fill-opacity="1" stroke="#a78bfa" stroke-width="3"/>
<rect x="200" y="645" width="490" height="8" rx="4" fill="#a78bfa"/>
<text x="224" y="695" font-size="34" fill="#a78bfa" font-weight="700" text-anchor="start" letter-spacing="0">L4</text>
<text x="294" y="695" font-size="28" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Governed Agent</text>
<text x="294" y="733" font-size="28" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Coordination</text>
<text x="224" y="795" font-size="24" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">scoped authority · trace</text>
<line x1="60" y1="850" x2="60" y2="50" stroke="#a78bfa" stroke-width="4" marker-end="url(#arp)" stroke-linecap="round"/>
<text x="360" y="905" font-size="28" fill="#c4b5fd" font-weight="600" text-anchor="middle" letter-spacing="0">Governance and audit</text>
<text x="360" y="943" font-size="28" fill="#c4b5fd" font-weight="600" text-anchor="middle" letter-spacing="0">requirements rise at every level</text>
</svg>
