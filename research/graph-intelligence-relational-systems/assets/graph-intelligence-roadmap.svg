<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Arial, sans-serif">
<title id="t">Graph Intelligence maturity roadmap</title>
<desc id="d">Four levels: Connected Retrieval, Evidence-Grounded Answers, Decision Support, Governed Agent Coordination. Governance requirements rise at each level.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1f"/><stop offset="1" stop-color="#0e1c42"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7db7ff"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<text x="600" y="60" font-size="24" fill="#9fb0d4" font-weight="700" text-anchor="middle" letter-spacing="3">MATURITY</text>
<rect x="30.0" y="320" width="270" height="200" rx="18" fill="#0f1f4a" fill-opacity="0.95" stroke="#3b82f6" stroke-width="3"/>
<rect x="30.0" y="320" width="270" height="8" rx="4" fill="#3b82f6"/>
<text x="54.0" y="372" font-size="32" fill="#3b82f6" font-weight="700" text-anchor="start" letter-spacing="0">L1</text>
<text x="54.0" y="414" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Connected</text>
<text x="54.0" y="446" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Retrieval</text>
<text x="54.0" y="498" font-size="22" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">entities · links</text>
<rect x="320.0" y="265" width="270" height="255" rx="18" fill="#0f1f4a" fill-opacity="0.95" stroke="#38bdf8" stroke-width="3"/>
<rect x="320.0" y="265" width="270" height="8" rx="4" fill="#38bdf8"/>
<text x="344.0" y="317" font-size="32" fill="#38bdf8" font-weight="700" text-anchor="start" letter-spacing="0">L2</text>
<text x="344.0" y="359" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Evidence-Grounded</text>
<text x="344.0" y="391" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Answers</text>
<text x="344.0" y="498" font-size="22" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">citations · receipts</text>
<rect x="610.0" y="210" width="270" height="310" rx="18" fill="#0f1f4a" fill-opacity="0.95" stroke="#22d3ee" stroke-width="3"/>
<rect x="610.0" y="210" width="270" height="8" rx="4" fill="#22d3ee"/>
<text x="634.0" y="262" font-size="32" fill="#22d3ee" font-weight="700" text-anchor="start" letter-spacing="0">L3</text>
<text x="634.0" y="304" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Decision</text>
<text x="634.0" y="336" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Support</text>
<text x="634.0" y="498" font-size="22" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">options · human review</text>
<rect x="900.0" y="155" width="270" height="365" rx="18" fill="#0f1f4a" fill-opacity="0.95" stroke="#a78bfa" stroke-width="3"/>
<rect x="900.0" y="155" width="270" height="8" rx="4" fill="#a78bfa"/>
<text x="924.0" y="207" font-size="32" fill="#a78bfa" font-weight="700" text-anchor="start" letter-spacing="0">L4</text>
<text x="924.0" y="249" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Governed Agent</text>
<text x="924.0" y="281" font-size="25" fill="#e8efff" font-weight="700" text-anchor="start" letter-spacing="0">Coordination</text>
<text x="924.0" y="498" font-size="22" fill="#9fb0d4" font-weight="400" text-anchor="start" letter-spacing="0">scoped authority · trace</text>
<line x1="30.0" y1="580" x2="1164.0" y2="580" stroke="#a78bfa" stroke-width="4" marker-end="url(#arp)" stroke-linecap="round"/>
<text x="600" y="626" font-size="26" fill="#c4b5fd" font-weight="600" text-anchor="middle" letter-spacing="0">Governance and audit requirements rise at every level</text>
</svg>
