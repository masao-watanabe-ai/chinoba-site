<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Retrieval Is Not Decision</title><desc id="d">Retrieval and Evidence sit on the AI-assisted side of a decision boundary. Policy, Human Approval and Action sit on the authority side. Insufficient or conflicting evidence loops back to retrieval or escalates to a person.</desc>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="760" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle">Retrieval Is Not Decision</text>
<text x="600" y="78" font-size="17" fill="#94a3b8" font-weight="normal" text-anchor="middle">Where proposing ends and deciding begins</text>
<rect x="40" y="210" width="200" height="150" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="140.0" y="245" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">Retrieval</text>
<text x="140.0" y="279" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">search, graph traversal,</text>
<text x="140.0" y="303" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">filters; candidates and</text>
<text x="140.0" y="327" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">counter-evidence</text>
<rect x="270" y="210" width="200" height="150" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="370.0" y="245" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">Evidence</text>
<text x="370.0" y="279" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">claims assembled with</text>
<text x="370.0" y="303" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">source and freshness;</text>
<text x="370.0" y="327" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">gaps and conflicts shown</text>
<rect x="500" y="210" width="200" height="150" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="600.0" y="245" font-size="21" fill="#fb923c" font-weight="bold" text-anchor="middle">Policy</text>
<text x="600.0" y="279" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">rules, constraints,</text>
<text x="600.0" y="303" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">authority and access</text>
<text x="600.0" y="327" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">checked</text>
<rect x="730" y="210" width="200" height="150" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="830.0" y="245" font-size="21" fill="#fb923c" font-weight="bold" text-anchor="middle">Human Approval</text>
<text x="830.0" y="279" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">a named person or role</text>
<text x="830.0" y="303" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">accepts, amends, rejects</text>
<text x="830.0" y="327" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">or escalates</text>
<rect x="960" y="210" width="200" height="150" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="1060.0" y="245" font-size="21" fill="#fb923c" font-weight="bold" text-anchor="middle">Action</text>
<text x="1060.0" y="279" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">executed under explicit</text>
<text x="1060.0" y="303" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">permission; outcome</text>
<text x="1060.0" y="327" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">recorded</text>
<line x1="242" y1="285.0" x2="266" y2="285.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#agray)"/>
<line x1="472" y1="285.0" x2="496" y2="285.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#agray)"/>
<line x1="702" y1="285.0" x2="726" y2="285.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#agray)"/>
<line x1="932" y1="285.0" x2="956" y2="285.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#agray)"/>
<line x1="485" y1="130" x2="485" y2="640" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"/>
<text x="485" y="118" font-size="15" fill="#f87171" font-weight="bold" text-anchor="middle">DECISION BOUNDARY</text>
<rect x="30" y="138" width="440" height="36" rx="14" fill="#0b1220" stroke="#0b1220" stroke-width="0"/>
<text x="250" y="166" font-size="15" fill="#60a5fa" font-weight="bold" text-anchor="middle">AI-ASSISTED  ·  may propose, may not decide</text>
<text x="840" y="166" font-size="15" fill="#fb923c" font-weight="bold" text-anchor="middle">AUTHORITY  ·  decides, permits, answers for the result</text>
<path d="M370 208 C370 180 150 180 140 208" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#agray)"/>
<text x="255" y="200" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle">re-retrieve</text>
<line x1="140" y1="364" x2="140" y2="420" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#apurple)"/>
<rect x="40" y="424" width="200" height="50" rx="10" fill="#12213f" stroke="#a78bfa" stroke-width="2"/>
<text x="140" y="456" font-size="16" fill="#a78bfa" font-weight="bold" text-anchor="middle">Retrieval Receipt</text>
<line x1="370" y1="364" x2="370" y2="420" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#apurple)"/>
<rect x="270" y="424" width="200" height="50" rx="10" fill="#12213f" stroke="#a78bfa" stroke-width="2"/>
<text x="370" y="456" font-size="16" fill="#a78bfa" font-weight="bold" text-anchor="middle">Evidence Pack</text>
<line x1="600" y1="364" x2="600" y2="420" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#apurple)"/>
<rect x="500" y="424" width="200" height="50" rx="10" fill="#12213f" stroke="#a78bfa" stroke-width="2"/>
<text x="600" y="456" font-size="16" fill="#a78bfa" font-weight="bold" text-anchor="middle">Authorization check</text>
<line x1="830" y1="364" x2="830" y2="420" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#apurple)"/>
<rect x="730" y="424" width="200" height="50" rx="10" fill="#12213f" stroke="#a78bfa" stroke-width="2"/>
<text x="830" y="456" font-size="16" fill="#a78bfa" font-weight="bold" text-anchor="middle">Decision Trace</text>
<line x1="1060" y1="364" x2="1060" y2="420" stroke="#a78bfa" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#apurple)"/>
<rect x="960" y="424" width="200" height="50" rx="10" fill="#12213f" stroke="#a78bfa" stroke-width="2"/>
<text x="1060" y="456" font-size="16" fill="#a78bfa" font-weight="bold" text-anchor="middle">Execution Receipt</text>
<rect x="40" y="500" width="440" height="120" rx="12" fill="#12213f" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="260.0" y="533" font-size="19" fill="#94a3b8" font-weight="bold" text-anchor="middle">If evidence is thin or in conflict</text>
<text x="260.0" y="567" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">the system says so: it re-retrieves,</text>
<text x="260.0" y="591" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">narrows scope, or escalates to a person.</text>
<text x="260.0" y="615" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">It does not fill the gap with fluency.</text>
<rect x="520" y="500" width="640" height="120" rx="12" fill="#12213f" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="840.0" y="533" font-size="19" fill="#94a3b8" font-weight="bold" text-anchor="middle">If policy or approval is missing</text>
<text x="840.0" y="567" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">the action stops on the safe side.</text>
<text x="840.0" y="591" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">A model's confidence is never a substitute for</text>
<text x="840.0" y="615" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">authority, and an answer is never a permission.</text>
<text x="600" y="690" font-size="20" fill="#f8fafc" font-weight="bold" text-anchor="middle">Retrieval widens what can be known.  Decision narrows what may be done.</text>
</svg>
