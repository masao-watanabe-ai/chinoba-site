<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Knowledge Flow Loop</title><desc id="d">Signal, Evidence, Context, Interpretation, Decision, Action and Feedback form a closed loop. Feedback returns to the knowledge layer, which feeds new signals and evidence. Source, time, authority and trace are carried through every transition.</desc>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="780" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle">The Knowledge Flow Loop</text>
<text x="600" y="78" font-size="17" fill="#94a3b8" font-weight="normal" text-anchor="middle">Information becomes a grounded decision, an action, and learning that returns to the knowledge layer</text>
<text x="600" y="122" font-size="15" fill="#60a5fa" font-weight="bold" text-anchor="middle">RETRIEVAL SIDE  ·  broad, exploratory, reversible</text>
<rect x="60" y="140" width="240" height="110" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="180.0" y="175" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">1  Signal</text>
<text x="180.0" y="209" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">something changes or is asked:</text>
<text x="180.0" y="233" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">event, record, question</text>
<rect x="340" y="140" width="240" height="110" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="460.0" y="175" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">2  Evidence</text>
<text x="460.0" y="209" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">what supports or contradicts it,</text>
<text x="460.0" y="233" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">with source and time</text>
<rect x="620" y="140" width="240" height="110" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="740.0" y="175" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">3  Context</text>
<text x="740.0" y="209" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">scope, version, subject,</text>
<text x="740.0" y="233" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">constraints, access rights</text>
<rect x="900" y="140" width="240" height="110" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="1020.0" y="175" font-size="21" fill="#60a5fa" font-weight="bold" text-anchor="middle">4  Interpretation</text>
<text x="1020.0" y="209" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">what it means here, what is</text>
<text x="1020.0" y="233" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">unknown, what conflicts</text>
<line x1="302" y1="195" x2="336" y2="195" stroke="#60a5fa" stroke-width="3" marker-end="url(#ablue)"/>
<line x1="582" y1="195" x2="616" y2="195" stroke="#60a5fa" stroke-width="3" marker-end="url(#ablue)"/>
<line x1="862" y1="195" x2="896" y2="195" stroke="#60a5fa" stroke-width="3" marker-end="url(#ablue)"/>
<line x1="1020" y1="252" x2="1020" y2="448" stroke="#fb923c" stroke-width="3" marker-end="url(#aorange)"/>
<text x="1034" y="350" font-size="15" fill="#fb923c" font-weight="normal" text-anchor="start">hand-off to authority</text>
<text x="1034" y="370" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="start">(not an automatic step)</text>
<text x="600" y="598" font-size="15" fill="#fb923c" font-weight="bold" text-anchor="middle">DECISION SIDE  ·  bounded, authorized, accountable</text>
<rect x="900" y="450" width="240" height="110" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="1020.0" y="485" font-size="21" fill="#fb923c" font-weight="bold" text-anchor="middle">5  Decision</text>
<text x="1020.0" y="519" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">person or role with authority;</text>
<text x="1020.0" y="543" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">policy and conditions applied</text>
<rect x="620" y="450" width="240" height="110" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="740.0" y="485" font-size="21" fill="#fb923c" font-weight="bold" text-anchor="middle">6  Action</text>
<text x="740.0" y="519" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">executed under permission,</text>
<text x="740.0" y="543" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">outcome observed</text>
<rect x="340" y="450" width="240" height="110" rx="12" fill="#12213f" stroke="#4ade80" stroke-width="2"/>
<text x="460.0" y="485" font-size="21" fill="#4ade80" font-weight="bold" text-anchor="middle">7  Feedback</text>
<text x="460.0" y="519" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">result compared with</text>
<text x="460.0" y="543" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">expectation; overrides noted</text>
<rect x="60" y="450" width="240" height="110" rx="12" fill="#12213f" stroke="#4ade80" stroke-width="2"/>
<text x="180.0" y="485" font-size="21" fill="#4ade80" font-weight="bold" text-anchor="middle">Knowledge Layer</text>
<text x="180.0" y="519" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">Semantic Chunks, relations,</text>
<text x="180.0" y="543" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">policies, versions</text>
<line x1="898" y1="505" x2="862" y2="505" stroke="#fb923c" stroke-width="3" marker-end="url(#aorange)"/>
<line x1="618" y1="505" x2="582" y2="505" stroke="#fb923c" stroke-width="3" marker-end="url(#aorange)"/>
<line x1="338" y1="505" x2="302" y2="505" stroke="#4ade80" stroke-width="3" marker-end="url(#agreen)"/>
<line x1="180" y1="448" x2="180" y2="252" stroke="#4ade80" stroke-width="3" marker-end="url(#agreen)"/>
<text x="194" y="350" font-size="15" fill="#4ade80" font-weight="normal" text-anchor="start">reviewed learning</text>
<text x="194" y="370" font-size="15" fill="#4ade80" font-weight="normal" text-anchor="start">becomes new knowledge</text>
<text x="600" y="340" font-size="24" fill="#f8fafc" font-weight="bold" text-anchor="middle">Retrieval proposes.</text>
<text x="600" y="372" font-size="24" fill="#f8fafc" font-weight="bold" text-anchor="middle">Authority decides.</text>
<rect x="60" y="640" width="1080" height="92" rx="14" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="676" font-size="17" fill="#a78bfa" font-weight="bold" text-anchor="middle">AUDIT &amp; TRACE across every transition</text>
<text x="600" y="708" font-size="17" fill="#cbd5e1" font-weight="normal" text-anchor="middle">Retrieval Receipt  ·  Evidence  ·  Decision Trace  ·  Outcome</text>
</svg>
