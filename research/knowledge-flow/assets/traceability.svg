<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Receipt, Evidence and Decision Trace</title><desc id="d">A Retrieval Receipt records how candidates were found, the Evidence Pack records what was relied on and what is missing or contradicted, and the Decision Trace records who decided under which authority and conditions. Together with the execution outcome they answer later questions and feed learning back to the knowledge layer.</desc>
<defs><marker id="ablue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="apurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ared" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="800" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle">Receipt, Evidence, and Decision Trace</text>
<text x="600" y="78" font-size="17" fill="#94a3b8" font-weight="normal" text-anchor="middle">Three linked records that make a decision explainable afterwards</text>
<rect x="50" y="120" width="340" height="300" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="220.0" y="156" font-size="23" fill="#60a5fa" font-weight="bold" text-anchor="middle">Retrieval Receipt</text>
<text x="220.0" y="184" font-size="16" fill="#94a3b8" font-weight="normal" text-anchor="middle">How candidates were found</text>
<line x1="74" y1="202" x2="366" y2="202" stroke="#60a5fa" stroke-width="1"/>
<text x="78" y="236" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  query and filters used</text>
<text x="78" y="274" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  data, index and version</text>
<text x="78" y="312" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  as-of time</text>
<text x="78" y="350" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  permissions applied</text>
<text x="78" y="388" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  candidates returned / excluded</text>
<rect x="430" y="120" width="340" height="300" rx="12" fill="#12213f" stroke="#4ade80" stroke-width="2"/>
<text x="600.0" y="156" font-size="23" fill="#4ade80" font-weight="bold" text-anchor="middle">Evidence Pack</text>
<text x="600.0" y="184" font-size="16" fill="#94a3b8" font-weight="normal" text-anchor="middle">What was relied on</text>
<line x1="454" y1="202" x2="746" y2="202" stroke="#4ade80" stroke-width="1"/>
<text x="458" y="236" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  claims selected, with sources</text>
<text x="458" y="274" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  freshness of each claim</text>
<text x="458" y="312" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  contradictions found</text>
<text x="458" y="350" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  gaps and stated uncertainty</text>
<text x="458" y="388" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  coverage of what was searched</text>
<rect x="810" y="120" width="340" height="300" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="980.0" y="156" font-size="23" fill="#fb923c" font-weight="bold" text-anchor="middle">Decision Trace</text>
<text x="980.0" y="184" font-size="16" fill="#94a3b8" font-weight="normal" text-anchor="middle">Who allowed it, and why</text>
<line x1="834" y1="202" x2="1126" y2="202" stroke="#fb923c" stroke-width="1"/>
<text x="838" y="236" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  decision and options considered</text>
<text x="838" y="274" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  decider and authority</text>
<text x="838" y="312" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  policy and version applied</text>
<text x="838" y="350" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  conditions and exceptions</text>
<text x="838" y="388" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="start">•  approval, time, result</text>
<line x1="392" y1="270" x2="428" y2="270" stroke="#94a3b8" stroke-width="3" marker-end="url(#agray)"/>
<line x1="772" y1="270" x2="808" y2="270" stroke="#94a3b8" stroke-width="3" marker-end="url(#agray)"/>
<rect x="810" y="480" width="340" height="110" rx="12" fill="#12213f" stroke="#fb923c" stroke-width="2"/>
<text x="980.0" y="514" font-size="20" fill="#fb923c" font-weight="bold" text-anchor="middle">Action and Outcome</text>
<text x="980.0" y="548" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">what was executed, when, by whom;</text>
<text x="980.0" y="572" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">what actually happened</text>
<line x1="980" y1="422" x2="980" y2="478" stroke="#fb923c" stroke-width="3" marker-end="url(#aorange)"/>
<rect x="430" y="480" width="340" height="110" rx="12" fill="#12213f" stroke="#4ade80" stroke-width="2"/>
<text x="600.0" y="514" font-size="20" fill="#4ade80" font-weight="bold" text-anchor="middle">Feedback and Review</text>
<text x="600.0" y="548" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">expected vs. actual; overrides;</text>
<text x="600.0" y="572" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">corrections proposed</text>
<line x1="808" y1="535" x2="772" y2="535" stroke="#fb923c" stroke-width="3" marker-end="url(#aorange)"/>
<rect x="50" y="480" width="340" height="110" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="220.0" y="514" font-size="20" fill="#60a5fa" font-weight="bold" text-anchor="middle">Knowledge Layer</text>
<text x="220.0" y="548" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">approved updates to chunks,</text>
<text x="220.0" y="572" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle">relations, policies, versions</text>
<line x1="428" y1="535" x2="392" y2="535" stroke="#4ade80" stroke-width="3" marker-end="url(#agreen)"/>
<rect x="50" y="620" width="1100" height="150" rx="14" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10 8"/>
<text x="600" y="652" font-size="17" fill="#a78bfa" font-weight="bold" text-anchor="middle">A later question, answered from the record rather than from memory</text>
<text x="80" y="704" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="start">What did we look for?</text>
<text x="80" y="734" font-size="17" fill="#60a5fa" font-weight="bold" text-anchor="start">→ Receipt</text>
<text x="450" y="704" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="start">What did we rely on?</text>
<text x="450" y="734" font-size="17" fill="#4ade80" font-weight="bold" text-anchor="start">→ Evidence</text>
<text x="820" y="704" font-size="18" fill="#f8fafc" font-weight="bold" text-anchor="start">Who allowed it, and why?</text>
<text x="820" y="734" font-size="17" fill="#fb923c" font-weight="bold" text-anchor="start">→ Trace</text>
</svg>
