<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="t d">
<title id="t">Governance structure around Evidence and Decision Trace</title><desc id="d">An Evidence Store and Decision Trace sits at the center. Research, Planning, Verifier, Policy Gate, Human Approver, and Execution Runner each write a specific kind of record to it, and an auditor reads from it.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7db7ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fd38d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0b0b0"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b48cff"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4fd1c5"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0b35a"/></marker></defs>
<rect width="1600" height="1100" fill="#0b0b0b"/>
<text x="800.0" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f5f5f5" text-anchor="middle">Evidence Is the Center of Governance</text>
<text x="800.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#b0b0b0" text-anchor="middle">Every role leaves a record. No role can rewrite another's.</text>
<circle cx="800" cy="550" r="150" fill="#15101f" stroke="#b48cff" stroke-width="3"/>
<text x="800" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#b48cff" text-anchor="middle">Evidence Store</text>
<text x="800" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#b48cff" text-anchor="middle">Decision Trace</text>
<text x="800" y="608" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">append-only</text>
<rect x="165.0" y="220.0" width="330" height="120" rx="14" fill="#111111" fill-opacity="1" stroke="#7db7ff" stroke-width="2.5"/>
<text x="330" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Research Agent</text>
<text x="330" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">records sources + citations</text>
<line x1="437.9128666143275" y1="341.9924978422733" x2="664.73153537456" y2="472.292584151343" stroke="#7db7ff" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="635.0" y="165.0" width="330" height="120" rx="14" fill="#111111" fill-opacity="1" stroke="#b48cff" stroke-width="2.5"/>
<text x="800" y="217" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Planning Agent</text>
<text x="800" y="253" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">records plan + rationale</text>
<line x1="800.0" y1="289.0" x2="800.0" y2="394.0" stroke="#b48cff" stroke-width="2.5" marker-end="url(#ap)"/>
<rect x="1105.0" y="220.0" width="330" height="120" rx="14" fill="#111111" fill-opacity="1" stroke="#4fd1c5" stroke-width="2.5"/>
<text x="1270" y="272" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Verifier Agent</text>
<text x="1270" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">records verdict + objections</text>
<line x1="1162.0871333856726" y1="341.9924978422733" x2="935.26846462544" y2="472.292584151343" stroke="#4fd1c5" stroke-width="2.5" marker-end="url(#at)"/>
<rect x="1105.0" y="760.0" width="330" height="120" rx="14" fill="#111111" fill-opacity="1" stroke="#f0b35a" stroke-width="2.5"/>
<text x="1270" y="812" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Human Approver</text>
<text x="1270" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">records decision + reason</text>
<line x1="1162.0871333856726" y1="758.0075021577268" x2="935.26846462544" y2="627.707415848657" stroke="#f0b35a" stroke-width="2.5" marker-end="url(#ay)"/>
<rect x="635.0" y="820.0" width="330" height="120" rx="14" fill="#111111" fill-opacity="1" stroke="#5fd38d" stroke-width="2.5"/>
<text x="800" y="872" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Policy Gate</text>
<text x="800" y="908" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">records policy version + permit</text>
<line x1="800.0" y1="816.0" x2="800.0" y2="706.0" stroke="#5fd38d" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="165.0" y="760.0" width="330" height="120" rx="14" fill="#111111" fill-opacity="1" stroke="#5fd38d" stroke-width="2.5"/>
<text x="330" y="812" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Execution Runner</text>
<text x="330" y="848" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b0b0b0" text-anchor="middle">records action + observed result</text>
<line x1="437.9128666143275" y1="758.0075021577268" x2="664.73153537456" y2="627.707415848657" stroke="#5fd38d" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="40" y="470" width="250" height="160" rx="14" fill="#150d0d" fill-opacity="1" stroke="#ff6b6b" stroke-width="2.2" stroke-dasharray="8 6"/>
<text x="165" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">Auditor</text>
<text x="165" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="middle">+ Monitor</text>
<text x="165" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#b0b0b0" text-anchor="middle">read-only access</text>
<line x1="646" y1="550" x2="294" y2="550" stroke="#ff6b6b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ar)"/>
<text x="470" y="535" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ff6b6b" text-anchor="middle">reads · can trigger</text>
<text x="470" y="578" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ff6b6b" text-anchor="middle">Kill Switch</text>
<rect x="40" y="980" width="1520" height="90" rx="14" fill="#111111" fill-opacity="1" stroke="#2a2a2a" stroke-width="1.8"/>
<text x="70" y="1016" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#6a6a6a" text-anchor="start">A trace should answer:</text>
<rect x="70" y="1030" width="136.5" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="138.25" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">Who asked</text>
<rect x="220.5" y="1030" width="186.5" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="313.75" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">What evidence</text>
<rect x="421.0" y="1030" width="174.0" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="508.0" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">Which policy</text>
<rect x="609.0" y="1030" width="174.0" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="696.0" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">Who approved</text>
<rect x="797.0" y="1030" width="161.5" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="877.75" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">What permit</text>
<rect x="972.5" y="1030" width="174.0" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="1059.5" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">What outcome</text>
<rect x="1160.5" y="1030" width="161.5" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b0b0b0" stroke-width="1.5"/>
<text x="1241.25" y="1054" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="1">How to undo</text>
</svg>
