<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="t d">
<title id="t">Agent roles and authority boundaries</title><desc id="d">Five roles — Research, Planning, Implementation, Verifier, and a permit-bound Execution Runner — each listed with what it may and may not do, governed by a Policy and Authorization Gate and recorded in an Evidence Store.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7db7ff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fd38d"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff6b6b"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b0b0b0"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b48cff"/></marker><marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4fd1c5"/></marker><marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0b35a"/></marker></defs>
<rect width="1600" height="1040" fill="#0b0b0b"/>
<text x="800.0" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f5f5f5" text-anchor="middle">Roles Are Boundaries, Not Personalities</text>
<text x="800.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#b0b0b0" text-anchor="middle">Each agent holds one narrow kind of authority — and is explicitly denied the next one</text>
<rect x="40" y="160" width="288" height="560" rx="16" fill="#111111" fill-opacity="1" stroke="#7db7ff" stroke-width="2.5"/>
<text x="62" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Research /</text>
<text x="62" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Retrieval Agent</text>
<rect x="62" y="268" width="150" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#7db7ff" stroke-width="1.5"/>
<text x="137.0" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#7db7ff" text-anchor="middle" letter-spacing="1">READ ONLY</text>
<text x="62" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5fd38d" text-anchor="start" letter-spacing="2">MAY</text>
<text x="62" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Read approved sources</text>
<text x="62" y="418.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Return cited evidence</text>
<line x1="62" y1="498" x2="306" y2="498" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="62" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6b6b" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="62" y="576.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Write to any system</text>
<text x="62" y="610.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Reach unlisted hosts</text>
<text x="62" y="644.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ See credentials</text>
<line x1="184.0" y1="720" x2="184.0" y2="790" stroke="#7db7ff" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="348" y="160" width="288" height="560" rx="16" fill="#111111" fill-opacity="1" stroke="#b48cff" stroke-width="2.5"/>
<text x="370" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Planning</text>
<text x="370" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Agent</text>
<rect x="370" y="268" width="130" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#b48cff" stroke-width="1.5"/>
<text x="435.0" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#b48cff" text-anchor="middle" letter-spacing="1">PROPOSES</text>
<text x="370" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5fd38d" text-anchor="start" letter-spacing="2">MAY</text>
<text x="370" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Break a goal into steps</text>
<text x="370" y="418.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Cite evidence per step</text>
<line x1="370" y1="498" x2="614" y2="498" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="370" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6b6b" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="370" y="576.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Call side-effect tools</text>
<text x="370" y="610.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Approve its own plan</text>
<line x1="492.0" y1="720" x2="492.0" y2="790" stroke="#b48cff" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="656" y="160" width="288" height="560" rx="16" fill="#111111" fill-opacity="1" stroke="#f0b35a" stroke-width="2.5"/>
<text x="678" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Implementation</text>
<text x="678" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Agent</text>
<rect x="678" y="268" width="130" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#f0b35a" stroke-width="1.5"/>
<text x="743.0" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f0b35a" text-anchor="middle" letter-spacing="1">DRAFTS</text>
<text x="678" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5fd38d" text-anchor="start" letter-spacing="2">MAY</text>
<text x="678" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Edit code in a sandbox</text>
<text x="678" y="418.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Open a change request</text>
<line x1="678" y1="498" x2="922" y2="498" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="678" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6b6b" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="678" y="576.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Merge or deploy</text>
<text x="678" y="610.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Add new connections</text>
<text x="678" y="644.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Touch prod secrets</text>
<line x1="800.0" y1="720" x2="800.0" y2="790" stroke="#f0b35a" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="964" y="160" width="288" height="560" rx="16" fill="#111111" fill-opacity="1" stroke="#4fd1c5" stroke-width="2.5"/>
<text x="986" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Verifier /</text>
<text x="986" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Challenge Agent</text>
<rect x="986" y="268" width="150" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#4fd1c5" stroke-width="1.5"/>
<text x="1061.0" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#4fd1c5" text-anchor="middle" letter-spacing="1">INDEPENDENT</text>
<text x="986" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5fd38d" text-anchor="start" letter-spacing="2">MAY</text>
<text x="986" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Re-run tests and checks</text>
<text x="986" y="418.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Challenge weak claims</text>
<line x1="986" y1="498" x2="1230" y2="498" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="986" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6b6b" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="986" y="576.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Edit the work it reviews</text>
<text x="986" y="610.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Share author's context</text>
<text x="986" y="644.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Be tuned by the author</text>
<line x1="1108.0" y1="720" x2="1108.0" y2="790" stroke="#4fd1c5" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="1272" y="160" width="288" height="560" rx="16" fill="#111111" fill-opacity="1" stroke="#5fd38d" stroke-width="2.5"/>
<text x="1294" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">Execution Runner</text>
<text x="1294" y="246" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f5f5f5" text-anchor="start">(permit-bound)</text>
<rect x="1294" y="268" width="150" height="34" rx="17" fill="#0b0b0b" fill-opacity="1" stroke="#5fd38d" stroke-width="1.5"/>
<text x="1369.0" y="292" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#5fd38d" text-anchor="middle" letter-spacing="1">ACTS ONCE</text>
<text x="1294" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#5fd38d" text-anchor="start" letter-spacing="2">MAY</text>
<text x="1294" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Run one permitted op</text>
<text x="1294" y="418.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">• Return the raw result</text>
<line x1="1294" y1="498" x2="1538" y2="498" stroke="#2a2a2a" stroke-width="1.5"/>
<text x="1294" y="542" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ff6b6b" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="1294" y="576.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Widen its own scope</text>
<text x="1294" y="610.1" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Reuse expired permits</text>
<text x="1294" y="644.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">✕ Act without a permit</text>
<line x1="1416.0" y1="720" x2="1416.0" y2="790" stroke="#5fd38d" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="40" y="790" width="1520" height="110" rx="16" fill="#0f1a14" fill-opacity="1" stroke="#5fd38d" stroke-width="2.5"/>
<text x="70" y="840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#5fd38d" text-anchor="start">Policy / Authorization Gate</text>
<text x="70" y="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">Holds the authority. Checks policy, issues scoped, expiring permits — and asks a Human Approver when risk requires it.</text>
<text x="1530" y="840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f0b35a" text-anchor="end" letter-spacing="2">HUMAN APPROVER</text>
<text x="1530" y="872" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#b0b0b0" text-anchor="end">for high-impact actions</text>
<rect x="40" y="930" width="1520" height="80" rx="16" fill="#15101f" fill-opacity="1" stroke="#b48cff" stroke-width="2.5"/>
<text x="70" y="983" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#b48cff" text-anchor="start">Audit Log / Evidence Store</text>
<text x="1530" y="983" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="end">append-only · captured by the platform, read-only for agents</text>
</svg>
