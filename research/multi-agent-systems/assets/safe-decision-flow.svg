<text x="70" y="892" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#b0b0b0" text-anchor="start">Captured by the gate, runner, and platform. Agents cannot edit or delete earlier records.</text>
