<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980" role="img" aria-labelledby="t d">
<title id="t">Safe decision flow: retrieve, propose, verify, approve, execute, audit</title><desc id="d">Six stages with their actors and outputs, a rejection loop from Verify back to Propose, a deny path at Approve, and an Evidence Store that every stage writes to.</desc>
