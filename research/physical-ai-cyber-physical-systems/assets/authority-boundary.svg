<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">Authority Boundary</title><desc id="d">AI reasoning proposes; the policy and authorization gate permits, denies or escalates; the safety controller executes within hard limits; the human supervisor approves, overrides and holds responsibility.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="790" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle" >Who May Decide What</text>
<text x="600" y="76" font-size="17" fill="#94a3b8" font-weight="normal" text-anchor="middle" >Capability to propose is separated from authority to act</text>
<rect x="40" y="110" width="1120" height="80" rx="12" fill="#24170a" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="60" y="146" font-size="22" fill="#fdba74" font-weight="bold" text-anchor="start" >Human Supervisor</text>
<text x="60" y="172" font-size="16" fill="#94a3b8" font-weight="normal" text-anchor="start" >Sets objectives and risk appetite · approves high-consequence actions · can stop or override at any time · holds responsibility</text>
<rect x="40" y="300" width="330" height="350" rx="12" fill="#1e1636" stroke="#a78bfa" stroke-width="2"/>
<text x="205" y="336" font-size="20" fill="#a78bfa" font-weight="bold" text-anchor="middle" >AI Reasoning &amp; Planning</text>
<text x="205" y="362" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Proposes</text>
<text x="58" y="402" font-size="13" fill="#86efac" font-weight="bold" text-anchor="start" letter-spacing="2">MAY</text>
<text x="58" y="426" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Describe the situation</text>
<text x="58" y="451" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Generate and rank candidates</text>
<text x="58" y="476" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Interpret anomalies, ask for context</text>
<text x="58" y="501" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Explain a trace afterwards</text>
<text x="58" y="548" font-size="13" fill="#fca5a5" font-weight="bold" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="58" y="572" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Issue equipment commands</text>
<text x="58" y="597" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Edit policy or safety limits</text>
<text x="58" y="622" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Approve its own proposal</text>
<rect x="435" y="300" width="330" height="350" rx="12" fill="#2d1b0c" stroke="#fb923c" stroke-width="2"/>
<text x="600" y="336" font-size="20" fill="#fb923c" font-weight="bold" text-anchor="middle" >Policy &amp; Authorization Gate</text>
<text x="600" y="362" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Permits · Denies · Escalates</text>
<text x="453" y="402" font-size="13" fill="#86efac" font-weight="bold" text-anchor="start" letter-spacing="2">MAY</text>
<text x="453" y="426" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Check policy version and scope</text>
<text x="453" y="451" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Check state freshness and confidence</text>
<text x="453" y="476" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Issue limited, expiring authorization</text>
<text x="453" y="501" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Route to a person when required</text>
<text x="453" y="548" font-size="13" fill="#fca5a5" font-weight="bold" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="453" y="572" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Be bypassed by any agent</text>
<text x="453" y="597" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Grant unbounded authority</text>
<text x="453" y="622" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Hide a denial</text>
<rect x="830" y="300" width="330" height="350" rx="12" fill="#2f1315" stroke="#f87171" stroke-width="2"/>
<text x="995" y="336" font-size="20" fill="#f87171" font-weight="bold" text-anchor="middle" >Safety Controller</text>
<text x="995" y="362" font-size="16" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Enforces — deterministically</text>
<text x="848" y="402" font-size="13" fill="#86efac" font-weight="bold" text-anchor="start" letter-spacing="2">MAY</text>
<text x="848" y="426" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Interlocks, limits, safe state</text>
<text x="848" y="451" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Reject out-of-envelope commands</text>
<text x="848" y="476" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Stop independent of AI and network</text>
<text x="848" y="501" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Work with no LLM available</text>
<text x="848" y="548" font-size="13" fill="#fca5a5" font-weight="bold" text-anchor="start" letter-spacing="2">MAY NOT</text>
<text x="848" y="572" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Be disabled by AI output</text>
<text x="848" y="597" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="start" >• Depend on a model response</text>
<line x1="375" y1="475" x2="431" y2="475" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="770" y1="475" x2="826" y2="475" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="404" y="460" font-size="12" fill="#94a3b8" font-weight="normal" text-anchor="middle" >proposal</text>
<text x="798" y="460" font-size="12" fill="#94a3b8" font-weight="normal" text-anchor="middle" >permit</text>
<line x1="600" y1="192" x2="600" y2="296" stroke="#fb923c" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="612" y="250" font-size="14" fill="#fdba74" font-weight="normal" text-anchor="start" >approve / deny</text>
<line x1="995" y1="192" x2="995" y2="296" stroke="#fb923c" stroke-width="2.5" marker-end="url(#ao)"/>
<text x="1007" y="250" font-size="14" fill="#fdba74" font-weight="normal" text-anchor="start" >stop / override</text>
<rect x="40" y="700" width="1120" height="64" rx="12" fill="#1b2230" stroke="#94a3b8" stroke-width="2"/>
<text x="600" y="730" font-size="20" fill="#f8fafc" font-weight="bold" text-anchor="middle" >Physical process</text>
<text x="600" y="752" font-size="15" fill="#94a3b8" font-weight="normal" text-anchor="middle" >machines · vehicles · robots · people nearby</text>
<line x1="995" y1="652" x2="995" y2="696" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="40" y="760" font-size="1" fill="#e2e8f0" font-weight="normal" text-anchor="start" ></text>
</svg>
