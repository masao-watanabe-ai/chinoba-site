<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">The Cyber-Physical Loop</title><desc id="d">Eight stages — Sense, Interpret, Estimate State, Decide, Authorize, Act, Observe, Learn — form a closed loop through the physical world, with the human supervisor and the decision trace spanning every stage.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="800" fill="#0b1220"/>
<text x="600" y="48" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle" >The Cyber-Physical Loop</text>
<text x="600" y="78" font-size="17" fill="#94a3b8" font-weight="normal" text-anchor="middle" >A closed loop through the physical world — every stage adds its own uncertainty</text>
<rect x="60" y="150" width="240" height="84" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="180.0" y="180" font-size="20" fill="#60a5fa" font-weight="bold" text-anchor="middle" >1  Sense</text>
<text x="180.0" y="119.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >sensor error · latency</text>
<text x="180.0" y="137.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >missing data</text>
<rect x="340" y="150" width="240" height="84" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="460.0" y="180" font-size="20" fill="#60a5fa" font-weight="bold" text-anchor="middle" >2  Interpret</text>
<text x="460.0" y="119.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >ambiguity · model error</text>
<text x="460.0" y="137.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >out-of-distribution input</text>
<rect x="620" y="150" width="240" height="84" rx="12" fill="#1e1636" stroke="#a78bfa" stroke-width="2"/>
<text x="740.0" y="180" font-size="20" fill="#a78bfa" font-weight="bold" text-anchor="middle" >3  Estimate State</text>
<text x="740.0" y="119.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >uncertainty · stale state</text>
<text x="740.0" y="137.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >conflicting sources</text>
<rect x="900" y="150" width="240" height="84" rx="12" fill="#1e1636" stroke="#a78bfa" stroke-width="2"/>
<text x="1020.0" y="180" font-size="20" fill="#a78bfa" font-weight="bold" text-anchor="middle" >4  Decide</text>
<text x="1020.0" y="119.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >AI proposes — it does</text>
<text x="1020.0" y="137.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >not command</text>
<rect x="900" y="470" width="240" height="84" rx="12" fill="#2d1b0c" stroke="#fb923c" stroke-width="2"/>
<text x="1020.0" y="500" font-size="20" fill="#fb923c" font-weight="bold" text-anchor="middle" >5  Authorize</text>
<text x="1020.0" y="583.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >policy · approval</text>
<text x="1020.0" y="601.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >human gate</text>
<rect x="620" y="470" width="240" height="84" rx="12" fill="#2f1315" stroke="#f87171" stroke-width="2"/>
<text x="740.0" y="500" font-size="20" fill="#f87171" font-weight="bold" text-anchor="middle" >6  Act</text>
<text x="740.0" y="583.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >actuator limits</text>
<text x="740.0" y="601.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >execution delay</text>
<rect x="340" y="470" width="240" height="84" rx="12" fill="#0f2a1c" stroke="#4ade80" stroke-width="2"/>
<text x="460.0" y="500" font-size="20" fill="#4ade80" font-weight="bold" text-anchor="middle" >7  Observe</text>
<text x="460.0" y="583.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >did the world respond</text>
<text x="460.0" y="601.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >as expected?</text>
<rect x="60" y="470" width="240" height="84" rx="12" fill="#0f2a1c" stroke="#4ade80" stroke-width="2"/>
<text x="180.0" y="500" font-size="20" fill="#4ade80" font-weight="bold" text-anchor="middle" >8  Learn</text>
<text x="180.0" y="583.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >review before any</text>
<text x="180.0" y="601.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >policy change</text>
<line x1="304" y1="192" x2="336" y2="192" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="584" y1="192" x2="616" y2="192" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="864" y1="192" x2="896" y2="192" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="1020" y1="238" x2="1020" y2="466" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="896" y1="512" x2="864" y2="512" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="616" y1="512" x2="584" y2="512" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="336" y1="512" x2="304" y2="512" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="180" y1="466" x2="180" y2="238" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ag)"/>
<rect x="340" y="290" width="520" height="130" rx="12" fill="#1b2230" stroke="#94a3b8" stroke-width="2"/>
<text x="600" y="335" font-size="24" fill="#f8fafc" font-weight="bold" text-anchor="middle" >Physical world</text>
<text x="600" y="365.0" font-size="16" fill="#94a3b8" font-weight="normal" text-anchor="middle" >people · machines · materials · environment</text>
<text x="600" y="387.4" font-size="16" fill="#94a3b8" font-weight="normal" text-anchor="middle" >changes in response — and by itself</text>
<line x1="735" y1="466" x2="735" y2="424" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="465" y1="424" x2="465" y2="466" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="748" y="452" font-size="14" fill="#fca5a5" font-weight="normal" text-anchor="start" >effect</text>
<text x="475" y="452" font-size="14" fill="#86efac" font-weight="normal" text-anchor="start" >consequence</text>
<rect x="60" y="650" width="1080" height="56" rx="12" fill="#24170a" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 5"/>
<text x="600" y="684" font-size="17" fill="#fdba74" font-weight="bold" text-anchor="middle" >Human supervisor — sets objectives, supervises, judges danger, intervenes, remains accountable (at every stage)</text>
<rect x="60" y="718" width="1080" height="56" rx="12" fill="#0e1a33" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 5"/>
<text x="600" y="752" font-size="17" fill="#93c5fd" font-weight="bold" text-anchor="middle" >Evidence &amp; Decision Trace — observation, state, rationale, authority, action and outcome are recorded together</text>
</svg>
