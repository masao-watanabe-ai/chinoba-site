<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
<title id="t">From Raw Signals to Semantic State</title><desc id="d">Raw signals are normalised and identified, bound into a semantic state with context, time, evidence and constraints, assessed against policy, and only then produce a permit, deny or escalate decision.</desc>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker><marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="750" fill="#0b1220"/>
<text x="600" y="46" font-size="30" fill="#f8fafc" font-weight="bold" text-anchor="middle" >From Raw Signals to an Executable Decision</text>
<text x="600" y="76" font-size="17" fill="#94a3b8" font-weight="normal" text-anchor="middle" >Nothing reaches the decision step as a bare reading</text>
<rect x="30" y="120" width="200" height="160" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="130.0" y="158" font-size="18" fill="#60a5fa" font-weight="bold" text-anchor="middle" >Raw Signals</text>
<text x="130.0" y="196" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Video · sensors</text>
<text x="130.0" y="226" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Logs · equipment status</text>
<text x="130.0" y="256" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Work records</text>
<rect x="265" y="120" width="200" height="160" rx="12" fill="#12213f" stroke="#60a5fa" stroke-width="2"/>
<text x="365.0" y="158" font-size="18" fill="#60a5fa" font-weight="bold" text-anchor="middle" >Normalize &amp; Identify</text>
<text x="365.0" y="196" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Which entity is this?</text>
<text x="365.0" y="226" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Time-align sources</text>
<text x="365.0" y="256" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Quality &amp; freshness check</text>
<rect x="500" y="120" width="200" height="160" rx="12" fill="#1e1636" stroke="#a78bfa" stroke-width="2"/>
<text x="600.0" y="158" font-size="18" fill="#a78bfa" font-weight="bold" text-anchor="middle" >Semantic State</text>
<text x="600.0" y="196" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >State · context · time</text>
<text x="600.0" y="226" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Evidence · constraints</text>
<text x="600.0" y="256" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Responsibility · confidence</text>
<rect x="735" y="120" width="200" height="160" rx="12" fill="#2d1b0c" stroke="#fb923c" stroke-width="2"/>
<text x="835.0" y="158" font-size="18" fill="#fb923c" font-weight="bold" text-anchor="middle" >Judgment</text>
<text x="835.0" y="196" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Candidate action</text>
<text x="835.0" y="226" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Policy &amp; boundary check</text>
<text x="835.0" y="256" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Uncertainty stated</text>
<rect x="970" y="120" width="200" height="160" rx="12" fill="#2f1315" stroke="#f87171" stroke-width="2"/>
<text x="1070.0" y="158" font-size="18" fill="#f87171" font-weight="bold" text-anchor="middle" >Execution Decision</text>
<text x="1070.0" y="196" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Permit (limited, expiring)</text>
<text x="1070.0" y="226" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Deny</text>
<text x="1070.0" y="256" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Escalate to a person</text>
<line x1="233" y1="200" x2="262" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="468" y1="200" x2="497" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="703" y1="200" x2="732" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="938" y1="200" x2="967" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="600" y="340" font-size="20" fill="#f8fafc" font-weight="bold" text-anchor="middle" >The same chain, worked through a generic example</text>
<rect x="30" y="360" width="200" height="110" rx="12" fill="#131b29" stroke="#94a3b8" stroke-width="2"/>
<text x="130.0" y="396" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >“Spindle temp</text>
<text x="130.0" y="422" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >= 85 °C”</text>
<text x="130.0" y="448" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >(one number)</text>
<rect x="265" y="360" width="200" height="110" rx="12" fill="#131b29" stroke="#94a3b8" stroke-width="2"/>
<text x="365.0" y="396" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Machine 3 · reading</text>
<text x="365.0" y="422" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >12 s old · sensor</text>
<text x="365.0" y="448" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >calibrated · clock OK</text>
<rect x="500" y="360" width="200" height="110" rx="12" fill="#131b29" stroke="#94a3b8" stroke-width="2"/>
<text x="600.0" y="396" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Over limit v4 · worker</text>
<text x="600.0" y="422" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >in zone B · reading</text>
<text x="600.0" y="448" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >stale if &gt; 30 s</text>
<rect x="735" y="360" width="200" height="110" rx="12" fill="#131b29" stroke="#94a3b8" stroke-width="2"/>
<text x="835.0" y="396" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Stop rule applies;</text>
<text x="835.0" y="422" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >confidence medium;</text>
<text x="835.0" y="448" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >cause unknown</text>
<rect x="970" y="360" width="200" height="110" rx="12" fill="#131b29" stroke="#94a3b8" stroke-width="2"/>
<text x="1070.0" y="396" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >Escalate: safe stop</text>
<text x="1070.0" y="422" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >is allowed, restart</text>
<text x="1070.0" y="448" font-size="15" fill="#cbd5e1" font-weight="normal" text-anchor="middle" >needs a person</text>
<line x1="233" y1="415" x2="262" y2="415" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ak)" stroke-dasharray="7 5"/>
<line x1="468" y1="415" x2="497" y2="415" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ak)" stroke-dasharray="7 5"/>
<line x1="703" y1="415" x2="732" y2="415" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ak)" stroke-dasharray="7 5"/>
<line x1="938" y1="415" x2="967" y2="415" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ak)" stroke-dasharray="7 5"/>
<rect x="30" y="520" width="1140" height="200" rx="12" fill="#17112b" stroke="#a78bfa" stroke-width="2" stroke-dasharray="7 5"/>
<text x="50" y="554" font-size="19" fill="#c4b5fd" font-weight="bold" text-anchor="start" >What a Semantic Chunk of physical state carries</text>
<rect x="50" y="576" width="172" height="116" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="136.0" y="616" font-size="18" fill="#c4b5fd" font-weight="bold" text-anchor="middle" >State</text>
<text x="136.0" y="644.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >what is true now</text>
<rect x="234" y="576" width="172" height="116" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="320.0" y="616" font-size="18" fill="#c4b5fd" font-weight="bold" text-anchor="middle" >Context</text>
<text x="320.0" y="644.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >where, which task, who</text>
<rect x="418" y="576" width="172" height="116" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="504.0" y="616" font-size="18" fill="#c4b5fd" font-weight="bold" text-anchor="middle" >Time</text>
<text x="504.0" y="644.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >how fresh, valid until</text>
<rect x="602" y="576" width="172" height="116" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="688.0" y="616" font-size="18" fill="#c4b5fd" font-weight="bold" text-anchor="middle" >Evidence</text>
<text x="688.0" y="644.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >which sources, how strong</text>
<rect x="786" y="576" width="172" height="116" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="872.0" y="616" font-size="18" fill="#c4b5fd" font-weight="bold" text-anchor="middle" >Constraints</text>
<text x="872.0" y="644.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >rules, limits, authority</text>
<rect x="970" y="576" width="172" height="116" rx="12" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
<text x="1056.0" y="616" font-size="18" fill="#c4b5fd" font-weight="bold" text-anchor="middle" >Open items</text>
<text x="1056.0" y="644.0" font-size="14" fill="#94a3b8" font-weight="normal" text-anchor="middle" >confidence, unresolved</text>
<line x1="600" y1="475" x2="600" y2="516" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)" stroke-dasharray="7 5"/>
</svg>
