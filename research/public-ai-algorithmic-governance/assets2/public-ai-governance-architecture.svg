<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d"><title id="t">Public AI governance reference architecture</title><desc id="d">Policy and legal basis constrains data, model, human decision, notice, and appeal. Vendor and procurement boundary surrounds data and model. Audit and decision trace record every step and feed back to policy.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a93a0"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7db7ff"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7fd1a8"/></marker><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0c070"/></marker></defs><rect width="1600" height="1000" fill="#0b0b0b"/>
<text x="60" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#8a93a0" text-anchor="start" letter-spacing="3">PUBLIC AI GOVERNANCE REFERENCE ARCHITECTURE</text>
<text x="60" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f5f5f5" text-anchor="start" letter-spacing="0">The AI recommends. A named official decides. The citizen can contest.</text>
<rect x="60" y="150" width="1480" height="100" rx="10" fill="#131820" stroke="#f0c070" stroke-width="2"/>
<text x="86" y="188" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f0c070" text-anchor="start" letter-spacing="2.5">POLICY &amp; LEGAL BASIS</text>
<text x="86" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Purpose  ·  eligibility rules  ·  legal authority  ·  rights that no model may override</text>
<rect x="60" y="300" width="640" height="300" rx="14" fill="none" stroke="#8a93a0" stroke-width="2" stroke-dasharray="12 8"/>
<text x="300" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a93a0" text-anchor="start" letter-spacing="2.5">VENDOR &amp; PROCUREMENT BOUNDARY</text>
<text x="80" y="584" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8a93a0" text-anchor="start" letter-spacing="0">Contracted: access, change notice, logs, audit rights</text>
<rect x="80" y="350" width="290" height="200" rx="10" fill="#131820" stroke="#7db7ff" stroke-width="2"/>
<text x="102" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7db7ff" text-anchor="start" letter-spacing="2.5">INPUT</text>
<text x="102" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Data &amp; evidence</text>
<text x="102" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">Provenance, quality,</text>
<text x="102" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">minimization, consent</text>
<rect x="410" y="350" width="270" height="200" rx="10" fill="#131820" stroke="#7db7ff" stroke-width="2"/>
<text x="432" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7db7ff" text-anchor="start" letter-spacing="2.5">RECOMMENDS</text>
<text x="432" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Model / algorithm</text>
<text x="432" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">Score or advice with</text>
<text x="432" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">factors and limits</text>
<rect x="760" y="350" width="290" height="200" rx="10" fill="#1b1810" stroke="#f0c070" stroke-width="2"/>
<text x="782" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f0c070" text-anchor="start" letter-spacing="2.5">DECIDES</text>
<text x="782" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Human decision</text>
<text x="782" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">Named owner with power</text>
<text x="782" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">to override; reasons logged</text>
<rect x="1090" y="350" width="200" height="200" rx="10" fill="#131820" stroke="#7fd1a8" stroke-width="2"/>
<text x="1112" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7fd1a8" text-anchor="start" letter-spacing="2.5">EXPLAINS</text>
<text x="1112" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Notice</text>
<text x="1112" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">Decision, reasons,</text>
<text x="1112" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">how to appeal</text>
<rect x="1330" y="350" width="210" height="200" rx="10" fill="#131820" stroke="#7fd1a8" stroke-width="2"/>
<text x="1352" y="384" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7fd1a8" text-anchor="start" letter-spacing="2.5">RECOURSE</text>
<text x="1352" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Appeal</text>
<text x="1352" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">Independent review,</text>
<text x="1352" y="486" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">correction, redress</text>
<line x1="370" y1="450" x2="408" y2="450" stroke="#8a93a0" stroke-width="3" marker-end="url(#a)"/>
<line x1="680" y1="450" x2="758" y2="450" stroke="#7db7ff" stroke-width="3" marker-end="url(#b)"/>
<line x1="1050" y1="450" x2="1088" y2="450" stroke="#f0c070" stroke-width="3" marker-end="url(#m)"/>
<line x1="1290" y1="450" x2="1328" y2="450" stroke="#7fd1a8" stroke-width="3" marker-end="url(#g)"/>
<line x1="800" y1="250" x2="800" y2="348" stroke="#f0c070" stroke-width="3" marker-end="url(#m)" stroke-dasharray="9 7"/>
<text x="815" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#f0c070" text-anchor="start" letter-spacing="0">authority &amp; rules</text>
<line x1="240" y1="250" x2="240" y2="348" stroke="#8a93a0" stroke-width="3" marker-end="url(#a)" stroke-dasharray="9 7"/>
<text x="255" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8a93a0" text-anchor="start" letter-spacing="0">purpose limits</text>
<line x1="80" y1="630" x2="680" y2="630" stroke="#7db7ff" stroke-width="3"/>
<text x="380" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7db7ff" text-anchor="middle" letter-spacing="3">PREDICTION</text>
<line x1="760" y1="630" x2="1050" y2="630" stroke="#f0c070" stroke-width="3"/>
<text x="905" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f0c070" text-anchor="middle" letter-spacing="3">AUTHORITY</text>
<line x1="1090" y1="630" x2="1540" y2="630" stroke="#7fd1a8" stroke-width="3"/>
<text x="1315" y="662" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7fd1a8" text-anchor="middle" letter-spacing="3">CITIZEN-FACING</text>
<rect x="60" y="720" width="1480" height="150" rx="10" fill="#131820" stroke="#7db7ff" stroke-width="2"/>
<text x="86" y="758" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7db7ff" text-anchor="start" letter-spacing="2.5">AUDIT, MONITORING &amp; DECISION TRACE</text>
<text x="86" y="802" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#f5f5f5" text-anchor="start" letter-spacing="0">Links every recommendation to the reviewer, the reasons, the notice, and the outcome.</text>
<text x="86" y="840" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#b8bec8" text-anchor="start" letter-spacing="0">Fairness metrics · drift · overrides and appeal outcomes · incidents · suspension</text>
<line x1="240" y1="672" x2="240" y2="718" stroke="#2f3a4a" stroke-width="2" marker-end="url(#a)" stroke-dasharray="9 7"/>
<line x1="545" y1="672" x2="545" y2="718" stroke="#2f3a4a" stroke-width="2" marker-end="url(#a)" stroke-dasharray="9 7"/>
<line x1="905" y1="672" x2="905" y2="718" stroke="#2f3a4a" stroke-width="2" marker-end="url(#a)" stroke-dasharray="9 7"/>
<line x1="1190" y1="672" x2="1190" y2="718" stroke="#2f3a4a" stroke-width="2" marker-end="url(#a)" stroke-dasharray="9 7"/>
<line x1="1435" y1="672" x2="1435" y2="718" stroke="#2f3a4a" stroke-width="2" marker-end="url(#a)" stroke-dasharray="9 7"/>
<path d="M1568 795 L1568 200 L1544 200" fill="none" stroke="#f0c070" stroke-width="3" marker-end="url(#m)" stroke-dasharray="9 7"/>
<text x="1500" y="940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="1" font-weight="400" fill="#f5f5f5" text-anchor="start" letter-spacing="0"></text>
<text x="60" y="925" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#f0c070" text-anchor="start" letter-spacing="0">Findings feed back into policy, rules, data, and the contract — and can suspend the system.</text>
</svg>