<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" role="img" aria-labelledby="t d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title id="t">Weak approval versus bound approval</title><desc id="d">Top: weak approval, where an AI proposal is approved by a click but a changed action executes. Bottom: bound approval, where the action payload is reviewed, a signed approval with hash, scope, and expiry is issued, and execution is verified to match before it runs once.</desc>
<defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14305c"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17808a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b83"/></marker></defs>
<rect width="900" height="790" fill="#f6f8fb"/>
<text x="450" y="44" font-size="28" fill="#14305c" font-weight="700" text-anchor="middle" >What the human saw must be what runs</text>
<rect x="30" y="70" width="840" height="300" rx="14" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<rect x="30" y="70" width="840" height="46" rx="14" fill="#c0392b"/><rect x="30" y="96" width="840" height="20" fill="#c0392b"/>
<text x="54" y="101" font-size="17" fill="#fff" font-weight="700" text-anchor="start" letter-spacing="2">WEAK APPROVAL</text>
<text x="846" y="101" font-size="16" fill="#fff" font-weight="400" text-anchor="end" >A click is not a control</text>
<rect x="60" y="140" width="240" height="92" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
<text x="80" y="179.525" font-size="19" fill="#14305c" font-weight="700" text-anchor="start" >AI proposal</text>
<text x="80" y="206.025" font-size="15" fill="#5b6b83" font-weight="400" text-anchor="start" >“Send offer to Customer A”</text>
<rect x="330" y="140" width="240" height="92" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
<text x="350" y="179.525" font-size="19" fill="#14305c" font-weight="700" text-anchor="start" >Human clicks Approve</text>
<text x="350" y="206.025" font-size="15" fill="#5b6b83" font-weight="400" text-anchor="start" >Sees a summary only</text>
<rect x="600" y="140" width="240" height="92" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
<text x="620" y="179.525" font-size="19" fill="#c0392b" font-weight="700" text-anchor="start" >Changed action runs</text>
<text x="620" y="206.025" font-size="15" fill="#5b6b83" font-weight="400" text-anchor="start" >Different target or terms</text>
<line x1="302" y1="186" x2="328" y2="186" stroke="#14305c" stroke-width="3" marker-end="url(#an)"/>
<line x1="572" y1="186" x2="598" y2="186" stroke="#14305c" stroke-width="3" marker-end="url(#an)"/>
<rect x="60" y="262" width="360" height="84" rx="10" fill="#fdf3f2" stroke="#c0392b" stroke-width="2"/>
<text x="78" y="290" font-size="14" fill="#c0392b" font-weight="700" text-anchor="start" letter-spacing="1">Human saw</text>
<text x="78" y="315.0" font-size="17" fill="#1d2b45" font-weight="400" text-anchor="start" >To: Customer A · Terms: X</text>
<text x="450" y="312" font-size="38" fill="#c0392b" font-weight="700" text-anchor="middle" >≠</text>
<rect x="480" y="262" width="360" height="84" rx="10" fill="#fdf3f2" stroke="#c0392b" stroke-width="2"/>
<text x="498" y="290" font-size="14" fill="#c0392b" font-weight="700" text-anchor="start" letter-spacing="1">Actually executed</text>
<text x="498" y="315.0" font-size="17" fill="#1d2b45" font-weight="400" text-anchor="start" >To: Customer B · Terms: X′</text>
<rect x="30" y="400" width="840" height="330" rx="14" fill="#fff" stroke="#17808a" stroke-width="2"/>
<rect x="30" y="400" width="840" height="46" rx="14" fill="#17808a"/><rect x="30" y="426" width="840" height="20" fill="#17808a"/>
<text x="54" y="431" font-size="17" fill="#fff" font-weight="700" text-anchor="start" letter-spacing="2">BOUND APPROVAL</text>
<text x="846" y="431" font-size="16" fill="#fff" font-weight="400" text-anchor="end" >Approval is tied to the exact action</text>
<rect x="48" y="470" width="140" height="118" rx="12" fill="#ffffff" stroke="#17808a" stroke-width="2"/>
<text x="118.0" y="512.7" font-size="16" fill="#14305c" font-weight="700" text-anchor="middle" >Action payload</text>
<text x="118.0" y="537.7" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >Target, terms,</text>
<text x="118.0" y="556.6" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >message, scope</text>
<rect x="214" y="470" width="140" height="118" rx="12" fill="#ffffff" stroke="#17808a" stroke-width="2"/>
<text x="284.0" y="512.7" font-size="16" fill="#14305c" font-weight="700" text-anchor="middle" >Human review</text>
<text x="284.0" y="537.7" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >Reviews the</text>
<text x="284.0" y="556.6" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >exact payload</text>
<rect x="380" y="470" width="140" height="118" rx="12" fill="#ffffff" stroke="#17808a" stroke-width="2"/>
<text x="450.0" y="512.7" font-size="16" fill="#14305c" font-weight="700" text-anchor="middle" >Bound approval</text>
<text x="450.0" y="537.7" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >Hash + scope +</text>
<text x="450.0" y="556.6" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >expiry, signed</text>
<rect x="546" y="470" width="140" height="118" rx="12" fill="#ffffff" stroke="#17808a" stroke-width="2"/>
<text x="616.0" y="512.7" font-size="16" fill="#14305c" font-weight="700" text-anchor="middle" >Verification</text>
<text x="616.0" y="537.7" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >Executed action</text>
<text x="616.0" y="556.6" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >= approved?</text>
<rect x="712" y="470" width="140" height="118" rx="12" fill="#ffffff" stroke="#17808a" stroke-width="2"/>
<text x="782.0" y="512.7" font-size="16" fill="#14305c" font-weight="700" text-anchor="middle" >Execute once</text>
<text x="782.0" y="537.7" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >Single-use,</text>
<text x="782.0" y="556.6" font-size="14" fill="#5b6b83" font-weight="400" text-anchor="middle" >then expires</text>
<line x1="190" y1="529" x2="212" y2="529" stroke="#17808a" stroke-width="3" marker-end="url(#at)"/>
<line x1="356" y1="529" x2="378" y2="529" stroke="#17808a" stroke-width="3" marker-end="url(#at)"/>
<line x1="522" y1="529" x2="544" y2="529" stroke="#17808a" stroke-width="3" marker-end="url(#at)"/>
<line x1="688" y1="529" x2="710" y2="529" stroke="#17808a" stroke-width="3" marker-end="url(#at)"/>
<rect x="60" y="618" width="360" height="84" rx="10" fill="#eef8f8" stroke="#17808a" stroke-width="2"/>
<text x="78" y="646" font-size="14" fill="#17808a" font-weight="700" text-anchor="start" letter-spacing="1">Approved payload</text>
<text x="78" y="671.0" font-size="17" fill="#1d2b45" font-weight="400" text-anchor="start" >hash 7f3a…c91e</text>
<text x="450" y="668" font-size="42" fill="#17808a" font-weight="700" text-anchor="middle" >=</text>
<rect x="480" y="618" width="360" height="84" rx="10" fill="#eef8f8" stroke="#17808a" stroke-width="2"/>
<text x="498" y="646" font-size="14" fill="#17808a" font-weight="700" text-anchor="start" letter-spacing="1">Payload at execution</text>
<text x="498" y="671.0" font-size="17" fill="#1d2b45" font-weight="400" text-anchor="start" >hash 7f3a…c91e → run</text>
<text x="450" y="764" font-size="20" fill="#14305c" font-weight="700" text-anchor="middle" font-style="italic">If anything changes, the approval no longer applies.</text>
</svg>